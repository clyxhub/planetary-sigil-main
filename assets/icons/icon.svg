<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#081230"/>
      <stop offset="100%" stop-color="#10284a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="64"/>

  <!-- Planet with ring -->
  <g transform="translate(256,240)">
    <circle r="96" fill="#ffd366" filter="url(#glow)"/>
    <ellipse rx="160" ry="48" fill="none" stroke="#ffe7a5" stroke-width="18" transform="rotate(-22)" opacity="0.95"/>
    <circle cx="-40" cy="-30" r="10" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Sigil glyph (stylized) -->
  <g transform="translate(256,256)">
    <path d="M-12,-36 L12,-36 L0,36" stroke="#081230" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="0" cy="8" r="10" fill="#081230" />
  </g>

  <!-- Small stars -->
  <g fill="#fff" opacity="0.9">
    <circle cx="420" cy="92" r="3" />
    <circle cx="380" cy="64" r="2" />
    <circle cx="100" cy="120" r="2.5" />
  </g>
</svg>
