name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Guarantee the exact SDK pieces the project pins
      # (compileSdk 34 + buildToolsVersion 35.0.0).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/planetarysigils.jks"
        shell: bash

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/planetarysigils.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
      - name: Verify receivers and permissions in APK
        if: success()
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          for token in BootReceiver AlarmReceiver ReminderReceiver AlarmService AlarmActivity RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM USE_EXACT_ALARM POST_NOTIFICATIONS FOREGROUND_SERVICE_MEDIA_PLAYBACK USE_FULL_SCREEN_INTENT WRITE_EXTERNAL_STORAGE; do
            grep -q "$token" /tmp/manifest.txt || { echo "MISSING: $token"; exit 1; }
          done
          echo "Manifest verification passed"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: planetary-sigils-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload AAB artifact (Play Store)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: planetary-sigils-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Rename outputs for release
        if: success()
        working-directory: android
        run: |
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/planetary-sigils.apk"
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/planetary-sigils.aab"
      - name: Attach APK and AAB to latest release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Planetary Sigils v1.0 (build ${{ github.run_number }})"
          body: |
            ## Planetary Sigils v1.0 — build ${{ github.run_number }}

            Built from commit `${{ github.sha }}` on ${{ github.ref_name }}.

            ### Install
            1. Download `planetary-sigils.apk` below.
            2. Allow "install from unknown sources" if your phone asks.
            3. Existing installs update in place — no need to uninstall.

            ### What's in this build
            - **AdMob banner** served at the bottom of the app using the real ad unit.
            - **Banner clears the navigation bar** — the ad view is inset by the
              device's real system-bar height natively, so it is no longer
              cropped or hidden behind the gesture/nav bar.
            - **Page content reserves the banner height** from first paint, so the
              ad never covers the page or the slide-out menu.
            - **AAB included** for Google Play upload: `planetary-sigils.aab`.

            ### Notes
            - `versionName` 1.0 — first Play-ready release.
            - Real ad fill depends on AdMob account status and is not guaranteed
              to appear immediately on a freshly created ad unit.

            ### Changes since the previous build
            ${{ github.event.head_commit.message }}
          files: |
            ${{ runner.temp }}/planetary-sigils.apk
            ${{ runner.temp }}/planetary-sigils.aab
          make_latest: true
